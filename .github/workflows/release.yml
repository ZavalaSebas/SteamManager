name: build & release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - id: check
        shell: pwsh
        run: |
          $old = git show HEAD~1:SteamManager/SteamManager.csproj 2>$null
          $new = Get-Content SteamManager/SteamManager.csproj -Raw
          $oldVer = [regex]::Match($old, '<Version>(.*?)</Version>').Groups[1].Value
          $newVer = [regex]::Match($new, '<Version>(.*?)</Version>').Groups[1].Value
          if ($oldVer -ne $newVer) {
            echo "changed=true" >> $env:GITHUB_OUTPUT
            echo "version=$newVer" >> $env:GITHUB_OUTPUT
          } else {
            echo "changed=false" >> $env:GITHUB_OUTPUT
          }

      - run: dotnet build SteamManager.slnx -c Release
      - run: dotnet test SteamManager.slnx -c Release --no-build

  release:
    if: needs.build.outputs.version_changed == 'true'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - run: >
          dotnet publish SteamManager/SteamManager.csproj
          -c Release -r win-x86 --self-contained true
          -p:PublishSingleFile=true

      - name: Generate release body
        shell: pwsh
        run: |
          $commit = git log -1 --pretty=%B
          @"
          ## SteamManager v${{ needs.build.outputs.new_version }}

          $commit
          "@ | Set-Content "${{ runner.temp }}/release_body.md"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.new_version }}
          body_path: ${{ runner.temp }}/release_body.md
          files: SteamManager/bin/Release/net10.0-windows/win-x86/publish/SteamManager.exe
