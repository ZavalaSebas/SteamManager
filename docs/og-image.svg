<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0F0F0F"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grid)" fill-opacity="0.03"/>

  <!-- Glow accents -->
  <ellipse cx="200" cy="315" rx="350" ry="350" fill="#66C0F4" opacity="0.06"/>
  <ellipse cx="1000" cy="315" rx="250" ry="250" fill="#2ECC71" opacity="0.05"/>

  <!-- Card -->
  <rect x="350" y="140" width="500" height="350" rx="24" fill="#1A1A1A" stroke="#66C0F4" stroke-opacity="0.15" stroke-width="1"/>
  <rect x="350" y="140" width="500" height="350" rx="24" fill="url(#cardGlow)" opacity="0.5"/>

  <!-- Icon box -->
  <rect x="400" y="180" width="80" height="80" rx="20" fill="#252525" stroke="#66C0F4" stroke-opacity="0.2" stroke-width="1"/>
  <text x="440" y="238" font-family="Segoe MDL2 Assets" font-size="44" fill="#66C0F4" text-anchor="middle">&#xE7BC;</text>

  <!-- Title -->
  <text x="510" y="216" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#E8E8E8">SteamManager</text>
  <text x="510" y="248" font-family="Inter, sans-serif" font-size="16" fill="#8A8A8A" font-weight="500">Your Steam Library, Better Browsing</text>

  <!-- Feature pills -->
  <rect x="400" y="290" width="180" height="36" rx="18" fill="#66C0F4" fill-opacity="0.08" stroke="#66C0F4" stroke-opacity="0.2" stroke-width="1"/>
  <text x="490" y="314" font-family="Inter, sans-serif" font-size="14" fill="#8FCDFF" text-anchor="middle" font-weight="600">Achievement Manager</text>

  <rect x="600" y="290" width="130" height="36" rx="18" fill="#66C0F4" fill-opacity="0.08" stroke="#66C0F4" stroke-opacity="0.2" stroke-width="1"/>
  <text x="665" y="314" font-family="Inter, sans-serif" font-size="14" fill="#8FCDFF" text-anchor="middle" font-weight="600">Global Rarity</text>

  <rect x="400" y="340" width="140" height="36" rx="18" fill="#66C0F4" fill-opacity="0.08" stroke="#66C0F4" stroke-opacity="0.2" stroke-width="1"/>
  <text x="470" y="364" font-family="Inter, sans-serif" font-size="14" fill="#8FCDFF" text-anchor="middle" font-weight="600">Offline Cache</text>

  <rect x="560" y="340" width="170" height="36" rx="18" fill="#66C0F4" fill-opacity="0.08" stroke="#66C0F4" stroke-opacity="0.2" stroke-width="1"/>
  <text x="645" y="364" font-family="Inter, sans-serif" font-size="14" fill="#8FCDFF" text-anchor="middle" font-weight="600">Favorites System</text>

  <!-- Bottom info -->
  <text x="600" y="430" font-family="Inter, sans-serif" font-size="14" fill="#5A5A5A" text-anchor="middle" font-weight="500">Free &amp; Open Source  ·  Windows 10/11  ·  WPFUI</text>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#66C0F4" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#66C0F4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#66C0F4" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
